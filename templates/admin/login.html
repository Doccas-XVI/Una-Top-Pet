<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar • UnaTopPet Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#0F766E', primaryLight: '#0D9488' } } } };</script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
  <form method="post" class="bg-white w-full max-w-sm rounded-2xl shadow-lg p-7 space-y-4">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}" />
    <div class="text-center">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-primary text-white flex items-center justify-center text-2xl">🐶</div>
      <h1 class="mt-3 text-xl font-bold text-primary">UnaTopPet</h1>
      <p class="text-xs text-slate-500">Área administrativa do pet shop. Teste</p>
    </div>
    {% for categoria, texto in get_flashed_messages(with_categories=true) %}
      <p class="px-3 py-2 rounded-lg bg-red-50 text-red-800 text-sm">{{ texto }}</p>
    {% endfor %}
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1" for="login">Login</label>
      <input id="login" name="login" required autofocus class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-primary" />
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1" for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-primary" />
    </div>
    <button class="w-full py-3 rounded-xl bg-primary hover:bg-primaryLight text-white font-semibold text-sm">Entrar</button>
    <p class="text-center text-[11px] text-slate-400"><a href="/" class="underline">Ir para o aplicativo do tutor</a></p>
  </form>
</body>
</html>
