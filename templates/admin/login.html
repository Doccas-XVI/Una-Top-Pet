<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2F3D41" />
  <title>Entrar • UNA Top Pet Admin</title>
  <link rel="icon" type="image/png" href="/static/brand/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/brand/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/brand/brand.css" />
</head>
<body class="paw-bg min-h-screen flex items-center justify-center p-4 font-sans text-primary-800">
  <div class="w-full max-w-md bg-white rounded-[28px] shadow-lift border border-primary-100 overflow-hidden animate-fade-in">
    <!-- Topo com o logo UNA Top Pet -->
    <div class="paw-bg px-7 pt-8 pb-7 text-center border-b border-primary-100">
      <img src="/static/brand/logo-unatoppet.png" alt="UNA Top Pet" class="w-48 mx-auto drop-shadow-sm select-none" draggable="false" />
      <p class="eyebrow eyebrow-center mt-4">Área administrativa</p>
    </div>

    <form method="post" class="p-7 space-y-4">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}" />
      {% for categoria, texto in get_flashed_messages(with_categories=true) %}
        <div class="notice notice-danger text-sm p-3">
          <svg class="ico w-4 h-4 mt-0.5"><use href="/static/brand/icons.svg#alert" /></svg>
          <span>{{ texto }}</span>
        </div>
      {% endfor %}
      <div>
        <label class="label" for="login">Login</label>
        <input id="login" name="login" required autofocus class="input w-full" placeholder="Usuário administrador" />
      </div>
      <div>
        <label class="label" for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required class="input w-full" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary btn-lg btn-block !mt-5">
        Entrar na área administrativa
        <svg class="ico"><use href="/static/brand/icons.svg#chevron-right" /></svg>
      </button>
      <div class="pt-4 border-t border-primary-100 flex items-center justify-center gap-4 text-xs">
        <a href="/" class="inline-flex items-center gap-1.5 text-primary-500 hover:text-primary-900 font-semibold transition">
          <svg class="ico w-3.5 h-3.5 text-accent-600"><use href="/static/brand/icons.svg#smartphone" /></svg> App mobile
        </a>
        <span class="text-primary-200">•</span>
        <a href="/web" class="inline-flex items-center gap-1.5 text-primary-500 hover:text-primary-900 font-semibold transition">
          <svg class="ico w-3.5 h-3.5 text-accent-600"><use href="/static/brand/icons.svg#globe" /></svg> Portal web
        </a>
      </div>
    </form>
  </div>
</body>
</html>
